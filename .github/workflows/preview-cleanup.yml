# Deletes stale disposable preview/* branches created by preview.yml.
#
# It cannot hook 'pull_request: closed' the way clean-cache.yml does: the
# accessibility pull requests are opened against joomla/joomla-cms, so this
# fork never sees their close event. Time-based cleanup instead.

name: Cleanup preview branches

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete preview branches with no commit newer than this many days'
        required: false
        default: '14'
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5
        with:
          fetch-depth: 0

      - name: Delete stale preview branches
        env:
          MAX_AGE_DAYS: ${{ inputs.max_age_days || '14' }}
        run: |
          set -euo pipefail
          cutoff=$(( $(date +%s) - MAX_AGE_DAYS * 86400 ))
          deleted=0

          while read -r timestamp branch; do
            [ -n "$branch" ] || continue
            if [ "$timestamp" -lt "$cutoff" ]; then
              echo "Deleting ${branch} (last commit $(date -u -d "@${timestamp}" +%Y-%m-%d))"
              git push --quiet origin --delete "${branch#origin/}"
              deleted=$((deleted + 1))
            else
              echo "Keeping  ${branch}"
            fi
          done < <(git for-each-ref --format='%(committerdate:unix) %(refname:short)' 'refs/remotes/origin/preview/*')

          echo "Deleted ${deleted} stale preview branch(es)."
