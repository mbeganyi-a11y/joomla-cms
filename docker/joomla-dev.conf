# Joomla's .htaccess needs AllowOverride to drive its rewrite rules.
# .devcontainer/Dockerfile only sets this for the TLS vhost; the local preview
# stack serves plain HTTP, so it is set here for the whole docroot.
<Directory /workspaces/joomla-cms>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
